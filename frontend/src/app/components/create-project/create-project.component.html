<div class="create-project-card">
  <h2>Create Project</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Project Name *
      <input type="text" formControlName="projectName" placeholder="e.g. QA Management Tool" />
    </label>
    <div class="field-error" *ngIf="form.get('projectName')?.touched && form.get('projectName')?.invalid">
      Project name is required.
    </div>

    <label>
      Description
      <textarea formControlName="description" rows="3" placeholder="Optional description"></textarea>
    </label>

    <label>
      Status
      <select formControlName="status">
        <option *ngFor="let status of allowedStatuses" [value]="status">{{ status }}</option>
      </select>
    </label>

    <div class="date-row">
      <label>
        Start Date
        <input type="date" formControlName="startDate" />
      </label>
      <label>
        End Date
        <input type="date" formControlName="endDate" />
      </label>
    </div>

    <button type="submit" [disabled]="submitting">
      {{ submitting ? 'Creating...' : 'Create Project' }}
    </button>

    <p class="success" *ngIf="successMessage">
      {{ successMessage }}
      <a *ngIf="createdProjectId" [routerLink]="['/projects', createdProjectId, 'edit']">Edit it</a>
    </p>
    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  </form>
</div>
